name: viber-controller
services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    mem_limit: 512m
    shm_size: 128mb
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: viber
      POSTGRES_USER: viber
      POSTGRES_PASSWORD: ${VIBER_POSTGRES_PASSWORD:?Set the local database password}
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - viber-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viber -d viber"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  viber-postgres:
